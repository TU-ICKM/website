# All ICKM conferences, one block per year.
# This file feeds the conference list, every year page, the home page, History and Publications.
# A new year means: copy one block, fill in what is known, leave the rest out.
#
# Fields (all optional except year and status):
#   year          the year
#   status        "held", "cancelled", "announced" (date or place public) or "planned" (nothing public yet)
#   theme         conference theme
#   city, region, country, venue
#   start, end    dates as YYYY-MM-DD, without quotes
#   format        "onsite", "virtual" or "hybrid"
#   hosts         list of names
#   partners      list of names
#   joint         one sentence if ICKM ran together with another event
#   geo           [latitude, longitude] of the city, for the maps (approximate, city centre; 2023: the state)
#   website       address of the conference website, if it still works
#   website_archive  link to a copy in the Internet Archive, if the website is gone
#   proceedings   { title = "...", publisher = "...", url = "..." }
#   notes         one sentence shown on the page
#
# Notes for the editors (sources, open checks) are kept outside this repository.
#
# Only for the coming conference (shown as cards on its page, "To be announced" while empty):
#   cfp           link to the call for papers
#   deadlines     [{ label = "Full papers", date = 2027-03-01 }, ...]
#   submission    link to the submission system of the host
#   registration  link to the registration of the host
#   programme     link to the programme
#
# Not shown on purpose (decisions of the Chair): ordinal numbers ("21st ICKM"), the history poster phases,
# place and date of the next conference before they are public.

