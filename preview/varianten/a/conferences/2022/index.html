          var raw = new Uint8Array(bits);
          return open(raw).then(function (html) {
            try { sessionStorage.setItem("ickm-preview-key", btoa(String.fromCharCode.apply(null, raw))); } catch (e) {}
            show(html);
          });
        })
        .catch(function () { m.textContent = "Wrong password."; });
    });
  });
})();
</script>
