# Site settings. Change these lines, then run: python build.py

title = "International Conference on Knowledge Management"
brand = "ICKM"
description = "The International Conference on Knowledge Management (ICKM), held since 2004."

# Address of the live site. Used for sitemap.xml once the site may be indexed.
base_url = "https://ickm.net"

# Paths at which the two builds are served. Only the 404 pages need them, all other links are relative.
# base_path: the transition page ("/" on ickm.net and on the preview server).
# full_path: the full site, which stays a preview behind the password until it goes live.
base_path = "/"
full_path = "/preview/"

# true = search engines are asked not to index the site (preview and transition phase).
noindex = true

# Which build goes to the root of the web server: "transition" (one page) or "full" (the whole site).
publish = "transition"

# Logo (globe with ICKM) and background videos, files in static/ (logo.svg, logo-dark.svg, favicon.svg, media/).
# false = the header shows "ICKM" as text and the page tops have no video.
logo = true
videos = true

# Photos from conferences. Stays false here: placeholder photos without cleared rights exist only on the local
# computer (photos-local/, not in git). Before going live they are replaced by own photos or photos with permission.
photos = false
