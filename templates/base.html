<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$page_title</title>
<meta name="description" content="$description">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#050b21" media="(prefers-color-scheme: dark)">
$robots
<script>
/* Light or dark mode and the menu on small screens. The choice is kept in this browser only (no cookie). */
(function () {
  var r = document.documentElement;
  try { var t = localStorage.getItem("ickm-theme"); if (t === "light" || t === "dark") r.setAttribute("data-theme", t); } catch (e) {}
  r.classList.add("js");
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("button");
    if (!b) return;
    if (b.classList.contains("theme-toggle")) {
      var cur = r.getAttribute("data-theme");
      var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      var next = dark ? "light" : "dark";
      r.setAttribute("data-theme", next);
      try { localStorage.setItem("ickm-theme", next); } catch (e) {}
    } else if (b.classList.contains("menu-toggle")) {
      var open = b.getAttribute("aria-expanded") !== "true";
      b.setAttribute("aria-expanded", open ? "true" : "false");
      document.body.classList.toggle("menu-open", open);
    }
  });
})();
</script>
<link rel="stylesheet" href="$css">
<link rel="icon" href="$favicon" type="image/svg+xml">
$script
</head>
<body class="$body_class">
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
<div class="wrap bar">
<a class="brand" href="$home">$brand</a>
$nav
<div class="tools">$tools</div>
</div>
<span class="scroll-progress" aria-hidden="true"></span>
</header>
<main id="main">
$content
</main>
<footer class="site-footer">
<div class="wrap">
$footer
</div>
</footer>
<a class="to-top" href="#main" aria-label="Back to top"><svg viewBox="0 0 40 40" aria-hidden="true" focusable="false"><circle class="tt-track" cx="20" cy="20" r="17"/><circle class="tt-bar" cx="20" cy="20" r="17" pathLength="100"/><path class="tt-arrow" d="M20 27V13M14 19l6-6 6 6"/></svg></a>
</body>
</html>
