# Builds the site with build.py and publishes it to GitHub Pages.
# Runs on every push to main. Pages must be set to "GitHub Actions" in the repository settings.
#
# INACTIVE COPY. GitHub only runs workflows stored in .github/workflows/.
# To switch it on, create the file .github/workflows/pages.yml on github.com (Add file > Create new file)
# and paste this content. Until then the site is published from the branch gh-pages.

name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
